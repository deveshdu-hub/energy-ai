<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FutureHQ AI Chatbot | Energy Insights</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #050816;
      color: white;
      overflow-x: hidden;
    }

    .glass {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .chat-container {
      max-width: 600px;
      margin: 40px auto;
      height: 600px;
      display: flex;
      flex-direction: column;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .message {
      margin-bottom: 15px;
      animation: slideIn 0.3s ease-in;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .user-message {
      text-align: right;
      margin-right: 10px;
    }

    .user-message .msg-text {
      background: linear-gradient(135deg, #8B5CF6, #00F0FF);
      color: #fff;
      padding: 12px 16px;
      border-radius: 18px 18px 4px 18px;
      display: inline-block;
      max-width: 80%;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
    }

    .bot-message {
      text-align: left;
      margin-left: 10px;
    }

    .bot-message .msg-text {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 12px 16px;
      border-radius: 18px;
      display: inline-block;
      max-width: 80%;
    }

    .chat-input-container {
      padding: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .input-group {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-field {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: white;
      padding: 12px 16px;
      border-radius: 24px;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      resize: none;
      max-height: 100px;
    }

    .input-field:focus {
      outline: none;
      background: rgba(139, 92, 246, 0.1);
      border-color: #00F0FF;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
    }

    .send-btn {
      background: linear-gradient(135deg, #8B5CF6, #00F0FF);
      color: #fff;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3);
    }

    .send-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 18px;
      width: fit-content;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00F0FF;
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-10px); }
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .suggestion-btn {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00F0FF;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s;
      font-weight: 500;
    }

    .suggestion-btn:hover {
      background: rgba(139, 92, 246, 0.2);
      border-color: #8B5CF6;
      transform: translateY(-2px);
    }

    .header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header h2 {
      font-size: 24px;
      margin-bottom: 5px;
      background: linear-gradient(90deg, #8B5CF6, #00F0FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-purple-900/10 to-cyan-900/10">

  <div class="chat-container glass rounded-3xl overflow-hidden relative">
    <div class="header">
      <h2>🤖 FutureHQ AI</h2>
      <p style="font-size: 12px; color: #a1a1aa;">Ask about India's energy future</p>
    </div>

    <div class="chat-messages scrollbar-hide" id="chatMessages">
      <div class="message bot-message">
        <div class="msg-text">
          👋 Hello! I'm FutureHQ's AI. Ask me about EV, Solar, Battery Tech, ROI, or Government Schemes!
        </div>
      </div>
    </div>

    <div class="chat-input-container">
      <div class="suggestions" id="suggestionsArea">
        <button class="suggestion-btn" onclick="sendSuggestion('What\'s the ROI?')">ROI?</button>
        <button class="suggestion-btn" onclick="sendSuggestion('Show opportunities')">Opportunities</button>
        <button class="suggestion-btn" onclick="sendSuggestion('Government schemes?')">Schemes</button>
        <button class="suggestion-btn" onclick="sendSuggestion('How to invest?')">Invest</button>
      </div>

      <form onsubmit="sendMessage(event)" style="margin-top: 15px;">
        <div class="input-group">
          <textarea id="messageInput" class="input-field" placeholder="Type your question..." rows="1"></textarea>
          <button type="submit" class="send-btn" id="sendBtn">➤</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const suggestionsArea = document.getElementById('suggestionsArea');

    // Dynamically tracking query selectors
    messageInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight > 100 ? 100 : this.scrollHeight) + 'px';
    });

    messageInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(e);
      }
    });

    function sendMessage(e) {
      e.preventDefault();
      const message = messageInput.value.trim();
      if (!message) return;

      addMessage(message, 'user');
      messageInput.value = '';
      messageInput.style.height = 'auto';
      sendBtn.disabled = true;

      if (suggestionsArea.style.display !== 'none') suggestionsArea.style.display = 'none';

      showTypingIndicator();
      fetchChatResponse(message);
    }

    function sendSuggestion(text) {
      messageInput.value = text;
      sendMessage({ preventDefault: () => {} });
    }

    function addMessage(text, sender) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${sender}-message`;
      const msgText = document.createElement('div');
      msgText.className = 'msg-text';
      msgText.innerHTML = text;
      messageDiv.appendChild(msgText);
      chatMessages.appendChild(messageDiv);
      setTimeout(() => { chatMessages.scrollTop = chatMessages.scrollHeight; }, 100);
    }

    function showTypingIndicator() {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message bot-message';
      messageDiv.id = 'typingIndicator';
      const msgText = document.createElement('div');
      msgText.className = 'typing-indicator';
      msgText.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      messageDiv.appendChild(msgText);
      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeTypingIndicator() {
      const typingIndicator = document.getElementById('typingIndicator');
      if (typingIndicator) typingIndicator.remove();
      sendBtn.disabled = false;
    }

    async function fetchChatResponse(message) {
      try {
        // Streamlit uses its own background internal structure. 
        // Falling straight to local fallback if production endpoints are offline.
        const localResponse = getLocalResponse(message);
        setTimeout(() => {
            removeTypingIndicator();
            addMessage(localResponse, 'bot');
        }, 600);
      } catch (error) {
        removeTypingIndicator();
        addMessage(getLocalResponse(message), 'bot');
      }
    }

    function getLocalResponse(message) {
      const msg = message.toLowerCase();
      const responses = {
        'invest': '💰 <b>Investment Matrix:</b><br>• EV Charging: ₹50K - ₹5L<br>• Solar Grid: ₹2L - ₹5L<br>• Advanced Battery: ₹20L - ₹1Cr',
        'roi': '📈 <b>Annualized Returns Profile:</b><br>• Solar Plants: 12-20%<br>• EV Charging Stations: 15-25%<br>• Battery Infrastructure: 20-35%',
        'growth': '📊 <b>Market Growth Matrix:</b><br>• EV Infrastructure: 40% YoY<br>• Solar Generation: 30% YoY<br>• Battery Solutions: 50% YoY',
        'scheme': '🎯 <b>Active Allocations:</b><br>• Green Hydrogen Mission: ₹19,744 Cr<br>• Manufacturing PLI: ₹10,000 Cr<br>• Solar Subsidies: Up to 40% matching funds available',
        'solar': '☀️ Solar deployment is running at 30% YoY growth. You can model your home or factory rooftop instantly in the <b>Subsidy Checker</b> tab above!',
        'ev': '🚗 Electric Vehicle infrastructure is accelerating at 40% YoY. See the <b>Investment Guide</b> panel for local infrastructure capital entry bounds.',
        'battery': '🔋 Industrial energy storage and lithium tech are expanding at 50% YoY due to global manufacturing PLI deployment.',
        'default': '💡 To get a custom financial breakdown for your exact location, enter your details under the <b>📱 Contact</b> tab above!'
      };

      for (const [key, response] of Object.entries(responses)) {
        if (msg.includes(key)) return response;
      }
      return responses.default;
    }

    messageInput.focus();
  </script>

</body>
</html>
